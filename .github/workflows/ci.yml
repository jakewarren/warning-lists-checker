name: CI

on:
  pull_request:
  # Pushes to the default branch are already covered by the deploy workflow,
  # which runs the same checks before it publishes. Ignoring them here keeps
  # the suite from running twice on every merge.
  push:
    branches-ignore: [main, master]
  workflow_dispatch:

permissions: {}

# A new push to the same PR supersedes the run in flight.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Harden the runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # No later step performs a git operation, so there is no reason to
          # leave the token sitting in .git/config for the rest of the job.
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Test
        run: npm test

      # `npm run build` runs tsc --noEmit and then vite build, so this covers
      # both type checking and that the app actually bundles.
      - name: Typecheck and build
        run: npm run build
