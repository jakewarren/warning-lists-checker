version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(actions)"
    # Only allow security updates by disabling version updates.
    # Security updates ignore this limit, so advisories still open a PR.
    open-pull-requests-limit: 0
    # Wait for major releases to stabilize (skips an initial .0 if .1 follows
    # quickly). Applies to version updates only — security updates are never
    # held back.
    cooldown:
      semver-major-days: 14
    groups:
      # Inert while the limit is 0; kept so re-enabling version updates gives
      # one PR rather than seven.
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
    open-pull-requests-limit: 0
    cooldown:
      semver-major-days: 14
    groups:
      # This project has zero runtime dependencies, so every update is a
      # devDependency; one grouped PR rather than several.
      dev-dependencies:
        patterns: ["*"]
